<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening document… | Deutsch Für Alle</title>
<style>body{font-family:system-ui,sans-serif;background:#06231a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{color:#4ade6b}</style></head>
<body><main><p id="m">Opening document…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="assets/dfa-auth.js?v=22"></script>
<script>
(async function(){var m=document.getElementById('m'),q=new URLSearchParams(location.search),id=+q.get('id'),t=q.get('type'),dl=q.get('dl')==='1',fmt=q.get('fmt')==='pdf'?'pdf':'png';function go(d){var u=dl&&d.download?d.download:d.url;if(u&&/^https:\/\//.test(u)){if(dl){m.innerHTML='Your download should start in a moment. <a href="javascript:history.back()">Go back</a>';location.href=u}else location.replace(u)}return !!u}
function fail(h){m.innerHTML=h}
if((!id&&!(t==='cert'&&q.get('no')))||!/^(admission|receipt|cert)$/.test(t))return fail('Invalid document link.');
var T=setTimeout(function(){fail('This is taking longer than usual. <a href="'+location.href.replace(/"/g,'')+'">Try again</a> or <a href="account.html">go to my account</a>.')},15000);
var ses=(await DFA.sb.auth.getSession()).data.session;if(!ses){clearTimeout(T);return fail('Please <a href="account.html?next='+encodeURIComponent('/doc.html'+location.search)+'">log in</a> first.')}
var role='';try{role=localStorage.getItem('dfa-pill')||''}catch(e){}
function call(adm){return DFA.invoke('admission',t==='cert'?{action:'cert_file_admin',id:id,fmt:fmt}:{action:adm?'doc_file_admin':'my_doc',id:id,kind:t})}
var adm=role==='admin'||(t==='cert'&&!q.get('no')),r;
if(t==='cert'&&!adm){var no=q.get('no'),mc=await DFA.invoke('admission',{action:'my_cert_file',no:no,fmt:fmt});clearTimeout(T);if(mc.data&&mc.data.url&&go(mc.data))return;return fail('Your certificate will be available here once it is released. <a href="portal.html">Back to the portal</a>')}
r=await call(adm);
if(!(r.data&&r.data.url)&&t!=='cert'){var r2=await call(!adm);if(r2.data&&r2.data.url)r=r2}
clearTimeout(T);
if(r.data&&r.data.url&&go(r.data)){}else fail(t==='cert'&&role!=='admin'?'Please open your certificate from the <a href="portal.html">student portal</a>.':DFA.esc((r.data&&r.data.error)||'Could not open the document.')+' <a href="account.html">Back to my account</a>')})();
</script></body></html>
