<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening document… | Deutsch Für Alle</title>
<style>body{font-family:system-ui,sans-serif;background:#06231a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0;text-align:center}a{color:#4ade6b}</style></head>
<body><main><p id="m">Opening document…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="assets/dfa-auth.js?v=4"></script>
<script>
(async function(){var m=document.getElementById('m'),q=new URLSearchParams(location.search),id=+q.get('id'),t=q.get('type');
function fail(h){m.innerHTML=h}
if(!id||!/^(admission|receipt|cert)$/.test(t))return fail('Invalid document link.');
var p=await DFA.profile();if(!p)return fail('Please <a href="account.html?next='+encodeURIComponent('/doc.html'+location.search)+'">log in</a> as admin first.');
if(p.role!=='admin')return fail('This document is for site staff only.');
var r=await DFA.sb.functions.invoke('admission',{body:t==='cert'?{action:'cert_file_admin',id:id}:{action:'doc_file_admin',id:id,kind:t}});
if(r.data&&r.data.url&&/^https:\/\//.test(r.data.url))location.replace(r.data.url);else fail(DFA.esc((r.data&&r.data.error)||'Could not open the document.')+' <a href="admin.html">Back to admin</a>')})();
</script></body></html>
